name: backtest

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python backtest.py
      - name: Guardar resultados
        run: |
          git config user.name "bot-trading"
          git config user.email "bot@users.noreply.github.com"
          git add data/backtest.csv
          if ! git diff --cached --quiet; then git commit -qm "Backtest" && git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin HEAD:"$GITHUB_REF_NAME"; fi
