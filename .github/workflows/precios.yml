name: precios

on:
  schedule:
    # Cada 15 min, de lunes a viernes, durante la sesión de EE. UU. (en UTC, cubre horario de verano e invierno)
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python prices.py
      - name: Guardar precios
        run: |
          git config user.name "bot-trading"
          git config user.email "bot@users.noreply.github.com"
          git add docs/prices.json
          if ! git diff --cached --quiet; then git commit -qm "Precios" && git pull -q --rebase origin main && git push -q origin main; fi
